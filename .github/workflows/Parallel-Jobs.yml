name: Parallel jobs
on: push

jobs:
  Build:
    runs-on: ubuntu-latest  
    steps:
      - run: echo "Building the project"


  Test:
    needs: Build
    runs-on: ubuntu-latest
    steps:
      - run: echo "Running tests"
      
  Security:
    needs: Build
    runs-on: ubuntu-latest
    steps:
      - run: echo "Running security checks"
