name: Parallel jobs

#on: push
on: workflow_dispatch

jobs:
  Build:
    runs-on: ubuntu-latest  
    steps:
      - run: echo "Building the project"


  Test:
    needs: Build
    runs-on: ubuntu-latest
    steps:
      - run: echo "Running tests"
      
  Security:
    needs: Build
    runs-on: ubuntu-latest
    steps:
      - run: echo "Running security checks"
