name: Node.js CI

on: push
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version: 20

            - name: Install Dependancies
              run: npm install
            
            - name: Run Test 
              run: npm test
            
            - name: Build Project
              run: npm run build

